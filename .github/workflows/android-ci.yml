name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Check documentation
        run: python3 tools/check-docs.py

      - name: Test trace analysis tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build and test modules
        run: >-
          ./gradlew --no-daemon --continue --stacktrace --console=plain
          verifyArchitectureBoundaries
          :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest
          :app:ireadview:testDebugUnitTest :app:ireadview-epub:testDebugUnitTest
          :app:ireadview:assembleDebugAndroidTest
          :app:ireadview:bundleReleaseRepository :app:ireadview-epub:bundleReleaseRepository

      - name: Build independent text Maven host
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain -p examples/maven-host
          :app:assembleDebug :app:assembleRelease

      - name: Build independent EPUB Maven host
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain -p examples/maven-epub-host
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
