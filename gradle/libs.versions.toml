[versions]
agp = "8.11.0"
kotlin = "2.0.21"
coreKtx = "1.10.1"
appcompat = "1.6.1"
junit = "4.13.2"
junitExt = "1.1.5"
espresso = "3.5.1"
coroutines = "1.9.0"
recyclerview = "1.4.0"
customview = "1.2.0"
jsoup = "1.23.2"
desugar = "2.1.5"
material = "1.10.0"
pagecurl = "0.1.0"

[libraries]
pagecurl-core = { group = "org.peyilo.pagecurl", name = "pagecurl-core", version.ref = "pagecurl" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-customview = { group = "androidx.customview", name = "customview", version.ref = "customview" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
desugar-jdk-nio = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
